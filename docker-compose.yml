version: "3.9"

services:
  backend:
    build: .
    command: npm run server
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=development
    # 若你有 .env，可在這裡加上
    # env_file:
    #   - .env

  frontend:
    build: .
    command: npm run dev -- --host 0.0.0.0
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
    environment:
      - NODE_ENV=development

