services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "npm install && npm run server"
    working_dir: /app
    ports:
      - "3001:3001"
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    # 載入專案根目錄 .env（DATA_SOURCE、NOTION_ROOT_PAGE_ID、ASANA_PROXY_CACHE_*）
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # 讓 Vite proxy 指向後端容器，而非 localhost（容器內 localhost 指自己）
      - VITE_PROXY_TARGET=http://backend:3001

volumes:
  backend_node_modules:
  frontend_node_modules:

