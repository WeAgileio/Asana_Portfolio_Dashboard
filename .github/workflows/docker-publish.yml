# 於 GitHub Release「發佈」後，建置 multi-arch 映像並推送到 Docker Hub。
#
# 必要 Repository Secrets：
#   DOCKERHUB_USERNAME  — Docker Hub 使用者名稱
#   DOCKERHUB_TOKEN     — Access Token（建議，勿用登入密碼）
# 選用：
#   VITE_BILLING_FIELD  — 請款欄位寫入前端建置（與本機 docker build --build-arg 相同）

name: Publish Docker image

on:
  release:
    types: [published]

env:
  IMAGE_NAME: yuminggood/asana_dashboard

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: meta
        run: |
          IMG="${{ env.IMAGE_NAME }}"
          REL="${{ github.event.release.tag_name }}"
          {
            echo "tags<<EOF"
            echo "${IMG}:latest"
            echo "${IMG}:${REL}"
            if [[ "$REL" == v* ]]; then echo "${IMG}:${REL#v}"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_BILLING_FIELD=${{ secrets.VITE_BILLING_FIELD }}
